apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tienda-mysql
  template:
    metadata:
      labels:
        app: tienda-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:5.7
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "admin123"
        - name: MYSQL_DATABASE
          value: "tienda_db"
        - name: MYSQL_USER
          value: "tienda_user"
        - name: MYSQL_PASSWORD
          value: "tienda_pass"
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc